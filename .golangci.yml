version: "2"
linters:
  default: none
  enable:
    - contextcheck
    - copyloopvar
    - durationcheck
    - errcheck
    - gocheckcompilerdirectives
    - gosec
    - govet
    - ineffassign
    - loggercheck
    - nilerr
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - testifylint
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: var-naming
    staticcheck:
      # In v2, staticcheck absorbed gosimple (S*), stylecheck (ST*) and
      # quickfix (QF*). ST*/QF* were never enabled before v2, and the S*
      # checks below were absent from the old gosimple list.
      checks:
        - all
        - -SA1024
        - -ST*
        - -QF*
        - -S1002
        - -S1013
        - -S1014
        - -S1015
        - -S1022
        - -S1026
        - -S1027
    testifylint:
      disable-all: true
      enable:
        - compares
        - empty
        - expected-actual
        - len
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: 'var-naming: don''t use an underscore in package name'
      # These fixtures reference alias constraints on purpose, so that mockery's
      # parser has them to exercise. Inlining them defeats the fixture.
      - linters:
          - govet
        text: 'inline: Type alias'
        path: internal/fixtures/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
