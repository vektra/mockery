name: Reusable Go Test

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        go_vers: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: ${{ matrix.go_vers }}

      # GOWORK=off keeps this scoped to the root module. In workspace mode a
      # bare `go mod download` fetches the whole workspace build list, including
      # graph-only deps of the tools module, and writes their hashes into
      # go.work.sum -- which then trips the git-state check.
      - name: Download dependencies
        run: go mod download -x
        env:
          GOWORK: "off"

      - name: Test
        run: go run github.com/go-task/task/v3/cmd/task test.ci
