version: "3"

tasks:
  coverage:
    deps: [test]
    desc: run unit tests and create HTML coverage file
    cmds:
      - go tool cover -html=coverage.txt

  fmt:
    desc: auto-format all go files
    sources:
      - "**/*.go"
    cmds:
      - gofumpt -l -w .

  mocks:
    desc: generate new mocks from scratch
    cmds:
      - task: mocks.remove
      - task: mocks.generate

  mocks.remove:
    desc: remove all mock files
    deps:
      - mocks.remove.windows
      - mocks.remove.unix

  mocks.remove.windows:
    desc: remove all mock files on windows
    platforms: ["windows"]
    cmds:
      - rm -f files.txt
      - where /r . '*_mock.go' > files.txt           || true
      - where /r . 'mock_*_test.go' >> files.txt     || true
      - where /r . 'mocks_moq.go' >> files.txt       || true
      - where /r . 'mocks_test.go' >> files.txt      || true
      - where /r . 'mocks_*_test.go' >> files.txt    || true
      - where /r . 'mocks_matryer_*.go' >> files.txt || true
      - where /r . 'mocks.go' >> files.txt           || true
      - powershell -Command 'foreach ($file in Get-Content "files.txt") { If (Test-Path $file) {Remove-Item $file} }'
      - rm -rf mocks/
      - rm -f files.txt


  mocks.remove.unix:
    desc: remove all mock files on unix
    platforms: ["darwin", "linux"]
    cmds:
      - find . -name '*_mock.go' -o -name 'mock_*_test.go' -o -name "mocks_moq.go"  -o -name 'mocks_test.go' -o -name 'mocks_*_test.go' -o -name 'mocks_matryer_*.go' -o -name 'mocks.go' | xargs -r rm
      - rm -rf mocks/

  # GOWORK=off on the `go run .` invocations below is deliberate. The workspace
  # includes ./tools, so in workspace mode MVS raises mockery's own dependencies
  # to the tools build list (e.g. golang.org/x/tools) and we would be generating
  # mocks with a parser that consumers of mockery never get.
  mocks.generate.custom:
    cmds:
      - GOWORK=off go run .

  mocks.generate.testify:
    desc: Generate testify mocks
    cmds:
      - MOCKERY_CONFIG=./.mockery_testify.yml GOWORK=off go run .

  mocks.generate.matryer:
    desc: Generate matryer mocks
    cmds:
      - MOCKERY_CONFIG=./.mockery_matryer.yml GOWORK=off go run .

  mocks.generate:
    desc: generate mocks
    deps:
      - mocks.generate.testify
      - mocks.generate.matryer

  git-state:
    desc: Check for a dirty git git-state
    cmds:
      - git diff --exit-code

  docker:
    desc: build the mockery docker image
    cmds:
      - docker build -t vektra/mockery .

  mkdocs.install:
    desc: install mkdocs and plugins
    sources:
      - "docs/requirements.txt"
    cmds:
      - pip install -r docs/requirements.txt

  mkdocs.serve:
    desc: serve mkdocs locally
    deps: [mkdocs.install]
    cmds:
      - mkdocs serve

  lint:
    desc: run all the defined linters
    sources:
      - "**/*.go"
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint run

  # gotestsum lives in tools/go.mod, so it normally resolves through the
  # workspace. The tests themselves must run with GOWORK=off (see the note on
  # mocks.generate.*), which rules that out -- build the binary from the tools
  # module up front instead, then invoke it directly.
  tools.gotestsum:
    desc: build gotestsum from the tools module
    sources:
      - tools/go.mod
      - tools/go.sum
    generates:
      - tools/gotestsum{{exeExt}}
    cmds:
      - cd ./tools && GOWORK=off go build -o gotestsum{{exeExt}} gotest.tools/gotestsum

  test:
    deps: [tools.gotestsum]
    cmds:
      - GOWORK=off ./tools/gotestsum{{exeExt}} --format testname -- -v -coverprofile=coverage.txt ./internal/... ./template_funcs/... ./template/...
    desc: run unit tests
    generates:
      - coverage.txt

  test.e2e:
    desc: run end-to-end tests
    deps: [tools.gotestsum]
    cmds:
      - bash ./e2e/run_all.sh
      - GOWORK=off ./tools/gotestsum{{exeExt}} --format testname -- -v -count=1 ./e2e/...

  test.ci:
    deps: [lint]
    cmds:
      - task: mocks
      - task: git-state
      - task: test
      - task: mocks.remove
      - task: test.e2e

  default:
    deps: [test.ci]

  build-tools:
    desc: Build tools directory
    cmds:
    - cd ./tools && go build -o tools .

  tag:
    desc: Tag the git repo with the version specified.
    deps: [build-tools]
    cmds:
    - ./tools/tools tag --dry-run=false

  tag.push:
    desc: Push tags to origin
    cmds:
    - git push origin --tags --force
